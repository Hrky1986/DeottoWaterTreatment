# Decap CMS configuration. Every save is a commit to the repository, which rebuilds the site.
backend:
  name: github
  repo: Hrky1986/DeottoWaterTreatment
  branch: main
  # TODO: GitHub login needs an OAuth proxy; set its URL here (see README).
  # base_url: https://deotto-cms-auth.example.workers.dev

# Photos are stored in the repository and resized and compressed when the site is built.
media_folder: src/assets/uploads
public_folder: /src/assets/uploads

# One folder per language. Add "hr" here when the Croatian version starts.
i18n:
  structure: multiple_folders
  locales: [en]
  default_locale: en

collections:
  - name: references
    label: References
    label_singular: Reference
    folder: src/content/references
    create: true
    i18n: true
    slug: '{{slug}}'
    summary: '{{title}} ({{location}})'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: 'Public title (no client name)', widget: string, i18n: true, hint: 'e.g. "40 MW AI data center, Norway". Shown until the client gives permission.' }
      - { name: client, label: 'Client / project name', widget: string, required: false, i18n: true }
      - { name: showClient, label: 'Client gave permission to publish their name', widget: boolean, default: false, i18n: duplicate, hint: 'Also shows the public source link.' }
      - { name: order, label: Order, widget: number, value_type: int, i18n: duplicate }
      - { name: featured, label: 'Featured on the home page', widget: boolean, default: false, i18n: duplicate }
      - { name: location, label: Location, widget: string, i18n: true }
      - { name: facility, label: Facility, widget: string, i18n: true }
      - { name: keyFigure, label: 'Key figure', widget: string, i18n: true }
      - { name: scope, label: 'Scope tags', widget: list, i18n: true }
      - { name: industry, label: Industry, widget: relation, collection: industries, search_fields: [title], value_field: '{{slug}}', display_fields: [title], i18n: duplicate }
      - { name: services, label: Services, widget: relation, collection: services, search_fields: [title], value_field: '{{slug}}', display_fields: [title], multiple: true, required: false, i18n: duplicate }
      - { name: year, label: Year, widget: string, required: false, i18n: duplicate }
      - { name: status, label: Status, widget: select, options: [completed, ongoing], required: false, i18n: duplicate }
      - { name: image, label: 'Hero photo', widget: image, required: false, i18n: duplicate }
      - { name: imageAlt, label: 'Photo description (alt text)', widget: string, required: false, i18n: true }
      - { name: challenge, label: 'The challenge', widget: text, i18n: true }
      - { name: ourScope, label: 'Our scope', widget: text, i18n: true }
      - { name: result, label: Result, widget: text, i18n: true }
      - label: 'Public source'
        name: source
        widget: object
        required: false
        i18n: duplicate
        fields:
          - { name: label, label: Name, widget: string }
          - { name: url, label: URL, widget: string, required: false }
      - { name: description, label: 'Search engine description', widget: text, i18n: true }

  - name: services
    label: Services
    label_singular: Service
    folder: src/content/services
    create: true
    i18n: true
    slug: '{{slug}}'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: order, label: Order, widget: number, value_type: int, i18n: duplicate }
      - { name: intro, label: 'Intro sentence', widget: text, i18n: true }
      - { name: included, label: "What's included", widget: list, i18n: true }
      - { name: systems, label: 'Typical systems', widget: list, i18n: true }
      - { name: standards, label: 'Standards badges', widget: list, required: false, i18n: duplicate }
      - { name: description, label: 'Search engine description', widget: text, i18n: true }
      - { name: body, label: 'Extra text (optional)', widget: markdown, required: false, i18n: true }

  - name: industries
    label: Industries
    label_singular: Industry
    folder: src/content/industries
    create: true
    i18n: true
    slug: '{{slug}}'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: order, label: Order, widget: number, value_type: int, i18n: duplicate }
      - { name: lead, label: 'Lead sector (uses the Data Centers page)', widget: boolean, default: false, i18n: duplicate }
      - { name: intro, label: Intro, widget: text, i18n: true }
      - { name: systems, label: 'Typical water systems', widget: list, i18n: true }
      - { name: help, label: 'How we help', widget: list, i18n: true }
      - { name: description, label: 'Search engine description', widget: text, i18n: true }
      - { name: body, label: 'Extra text (optional)', widget: markdown, required: false, i18n: true }

  - name: pages
    label: Pages
    i18n: true
    files:
      - name: about
        label: About
        file: src/content/pages/{{locale}}/about.md
        i18n: true
        fields: &page
          - { name: title, label: Title, widget: string, i18n: true }
          - { name: lede, label: Intro, widget: text, required: false, i18n: true }
          - { name: description, label: 'Search engine description', widget: text, i18n: true }
          - { name: body, label: Text, widget: markdown, i18n: true }
      - name: privacy
        label: Privacy and cookies
        file: src/content/pages/{{locale}}/privacy.md
        i18n: true
        fields: *page
